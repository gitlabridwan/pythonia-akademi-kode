name: Deploy PYTHONIA ke GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validasi paket game
        run: npm run validate
      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5
      - name: Unggah situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Terbitkan situs
        id: deployment
        uses: actions/deploy-pages@v4
